name: Release

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '24'

# Reset first, then grant only what each job needs.
# npm Trusted Publisher must match this filename exactly: release.yml
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changelog-github looks up the commit that added each changeset.
          # A shallow clone then runs `git fetch --deepen` and fails because
          # persist-credentials is false.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        with:
          script: pnpm run version-packages
          commit-message: Version packages
          pr-title: Version packages
        env:
          # changelog-github calls the GitHub API to link PRs and authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Changesets describes every package separately, while GitHub gets a single
      # release for all of them. The description is replaced with a preview of
      # that release, built from the changelogs on the release branch.
      - name: Show the GitHub release in the release pull request
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          git fetch origin changeset-release/main
          git checkout --detach FETCH_HEAD
          VERSION=$(node -p "require('./packages/flags/package.json').version")
          {
            echo "Merging this pull request publishes all \`@tabler/flags*\` packages in version **${VERSION}** to npm and creates the following GitHub release."
            echo
            echo "---"
            echo
            node ./.build/release-notes.mjs
          } > body.md
          gh pr edit "$PR_NUMBER" --body-file body.md

  pack:
    name: Pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish packages
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted Publishers needs npm >= 11.5.1. Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All packages are released together in one version (see `fixed` in
      # .changeset/config.json): one `v<version>` tag and one GitHub release
      # below, instead of a tag and a release for every package.
      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false
          push-git-tags: false

      # Created even when the publish step fails (for example when npm rejects a
      # package that was already published in an earlier run), the packages that
      # were published should not stay without the release.
      - name: Create GitHub release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/flags/package.json').version")
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 0
          fi
          node ./.build/release-notes.mjs > notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "Release ${VERSION}" --notes-file notes.md
